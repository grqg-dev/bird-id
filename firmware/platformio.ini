; bird-id ESP32-S3 sensor firmware.
;
; Target board: ESP32-S3-N16R8 (16 MB flash, 8 MB OPI PSRAM).
; The PSRAM holds the 48 kHz audio ring buffer + upload retry queue; flash holds
; the Edge Impulse model library (dropped into lib/ei-bird-model/).
;
;   pio run -t upload && pio device monitor

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 memory: 16 MB flash + 8 MB octal (OPI) PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Edge Impulse SDK is happiest with these:
  -DEI_CLASSIFIER_ALLOCATION_STATIC=1
  -O2

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
